
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>타이머</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f5f6f8;
    color: #20242b;
    font-family: "Malgun Gothic", "Apple SD Gothic Neo",
      Arial, sans-serif;
  }

  .timer {
    width: min(1050px, 96vw);
    padding: 48px 24px;
    text-align: center;
  }

  h1 {
    font-size: clamp(42px, 5vw, 64px);
    margin: 0 0 48px;
    font-weight: 750;
    letter-spacing: -2px;
  }

  .display {
    font-size: clamp(64px, 13vw, 150px);
    font-weight: 750;
    font-variant-numeric: tabular-nums;
    letter-spacing: -5px;
    white-space: nowrap;
    margin-bottom: 48px;
  }

  .inputs {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 48px;
  }

  .field {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .field label {
    font-size: 23px;
    font-weight: 600;
  }

  .field input {
    width: clamp(85px, 14vw, 140px);
    height: 80px;
    border: 2px solid #d9dde5;
    border-radius: 16px;
    background: white;
    color: #20242b;
    text-align: center;
    font-size: 35px;
    font-weight: 650;
    font-family: inherit;
  }

  .field input:focus {
    outline: none;
    border-color: #4679e8;
  }

  .controls {
    display: flex;
    justify-content: center;
    gap: 18px;
  }

  button {
    border: none;
    border-radius: 16px;
    padding: 22px 46px;
    font-family: inherit;
    font-size: 26px;
    font-weight: 700;
    cursor: pointer;
    transition: background .2s;
  }

  .start {
    background: #356de8;
    color: white;
    min-width: 220px;
  }

  .start:hover {
    background: #245bd3;
  }

  .reset {
    background: #e2e6ed;
    color: #30343a;
  }

  .reset:hover {
    background: #d4d9e2;
  }

  .status {
    margin-top: 40px;
    font-size: 22px;
    color: #68717e;
    min-height: 30px;
  }

  @media (max-width: 600px) {
    .timer { padding: 30px 10px; }
    h1 { margin-bottom: 35px; }
    .display {
      font-size: clamp(50px, 12vw, 85px);
      letter-spacing: -3px;
      margin-bottom: 38px;
    }
    .inputs { gap: 10px; }
    .field label { font-size: 18px; }
    .field input {
      height: 65px;
      font-size: 27px;
    }
    .controls { gap: 12px; }
    button {
      padding: 18px 25px;
      font-size: 21px;
    }
    .start { min-width: 150px; }
    .status { font-size: 18px; }
  }
</style>
</head>
<body>

<main class="timer">
  <h1>타이머</h1>

  <div class="display" id="display" role="timer">
    00:05:00
  </div>

  <div class="inputs">
    <div class="field">
      <label for="hours">시간</label>
      <input type="number" id="hours"
        min="0" max="99" value="0">
    </div>

    <div class="field">
      <label for="minutes">분</label>
      <input type="number" id="minutes"
        min="0" max="59" value="5">
    </div>

    <div class="field">
      <label for="seconds">초</label>
      <input type="number" id="seconds"
        min="0" max="59" value="0">
    </div>
  </div>

  <div class="controls">
    <button class="start" id="start">시작</button>
    <button class="reset" id="reset">초기화</button>
  </div>

  <div class="status" id="status">
    시간을 설정하고 시작하세요.
  </div>
</main>

<script>
  const hoursInput = document.getElementById("hours");
  const minutesInput = document.getElementById("minutes");
  const secondsInput = document.getElementById("seconds");

  const display = document.getElementById("display");
  const startBtn = document.getElementById("start");
  const resetBtn = document.getElementById("reset");
  const status = document.getElementById("status");

  let remaining = 300;
  let running = false;
  let deadline = 0;
  let interval = null;

  function getInputSeconds() {
    const h = Number(hoursInput.value);
    const m = Number(minutesInput.value);
    const s = Number(secondsInput.value);

    if (
      !Number.isInteger(h) || h < 0 || h > 99 ||
      !Number.isInteger(m) || m < 0 || m > 59 ||
      !Number.isInteger(s) || s < 0 || s > 59
    ) {
      return null;
    }

    return h * 3600 + m * 60 + s;
  }

  function render() {
    const h = Math.floor(remaining / 3600);
    const m = Math.floor((remaining % 3600) / 60);
    const s = remaining % 60;

    const time = [h, m, s]
      .map(n => String(n).padStart(2, "0"))
      .join(":");

    display.textContent = time;
    document.title = time + " - 타이머";
  }

  function stop() {
    clearInterval(interval);
    interval = null;
    running = false;
    deadline = 0;
    startBtn.textContent = "시작";
  }

  function tick() {
    remaining = Math.max(
      0,
      Math.ceil((deadline - Date.now()) / 1000)
    );

    render();

    if (remaining === 0) {
      stop();
      status.textContent = "시간이 종료되었습니다!";
      startBtn.textContent = "다시 시작";
    }
  }

  function startOrPause() {
    if (running) {
      tick();
      if (running) {
        stop();
        status.textContent = "일시정지";
      }
      return;
    }

    if (remaining === 0) {
      const value = getInputSeconds();

      if (value === null || value === 0) {
        alert("올바른 시간을 입력해주세요.");
        return;
      }

      remaining = value;
    }

    deadline = Date.now() + remaining * 1000;
    running = true;
    startBtn.textContent = "일시정지";
    status.textContent = "타이머 실행 중";

    interval = setInterval(tick, 250);
    tick();
  }

  function reset() {
    const value = getInputSeconds();

    if (value === null) {
      alert("올바른 시간을 입력해주세요.");
      return;
    }

    stop();
    remaining = value;
    status.textContent = "준비 완료";
    render();
  }

  [hoursInput, minutesInput, secondsInput]
    .forEach(input => {
      input.addEventListener("change", () => {
        if (!running) reset();
      });
    });

  startBtn.addEventListener("click", startOrPause);
  resetBtn.addEventListener("click", reset);

  render();
</script>
</body>
</html>
